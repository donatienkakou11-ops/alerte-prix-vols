<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flight Price Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #f9fafb;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f172a;
                --fg: #f1f5f9;
                --muted: #94a3b8;
                --border: #334155;
                --accent: #3b82f6;
                --success: #34d399;
                --warning: #fbbf24;
                --danger: #f87171;
                --card-bg: #1e293b;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #0f172a;
            --fg: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --card-bg: #1e293b;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px) 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-block: 24px;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--fg);
        }

        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--fg);
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }

        .price-info {
            flex: 1;
            min-width: 0;
        }

        .airline {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
            margin: 0 0 4px 0;
        }

        .cabin {
            font-size: 12px;
            color: var(--muted);
            margin: 0;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            text-align: right;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .stat {
            background: var(--bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin: 4px 0 0 0;
        }

        .empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        function FlightDashboard() {
            const [prices, setPrices] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchPrices = async () => {
                    try {
                        // Remplace par ton URL Render
                        const API_URL = 'https://alerte-prix-vols.onrender.com/api/latest-prices';
                        const response = await fetch(API_URL);
                        const result = await response.json();

                        if (result.success && result.data) {
                            const formatted = result.data.map(p => ({
                                route: p.departure_city && p.arrival_city ?
                                    p.departure_city + ' → ' + p.arrival_city : 'Unknown',
                                airline: p.airline || 'Unknown',
                                cabin: p.cabin_class || 'Economy',
                                price: p.price || 0,
                                currency: p.currency || 'XOF'
                            }));
                            setPrices(formatted);
                        }
                    } catch (error) {
                        console.error('Erreur API:', error);
                    } finally {
                        setLoading(false);
                    }
                };

                fetchPrices();
            }, []);

            if (loading) {
                return React.createElement('div', { className: 'container' },
                    React.createElement('div', { className: 'header' },
                        React.createElement('h1', { className: 'title' }, '✈️ Flight Price Monitor'),
                        React.createElement('p', { className: 'subtitle' }, 'Chargement des données...')
                    )
                );
            }

            const groupedPrices = {};
            prices.forEach(price => {
                if (!groupedPrices[price.route]) groupedPrices[price.route] = [];
                groupedPrices[price.route].push(price);
            });

            const minPrice = prices.length > 0 ? Math.min(...prices.map(p => p.price)) : 0;
            const maxPrice = prices.length > 0 ? Math.max(...prices.map(p => p.price)) : 0;
            const avgPrice = prices.length > 0 ? Math.round(prices.reduce((sum, p) => sum + p.price, 0) / prices.length) : 0;

            const priceItems = prices.map((price, idx) =>
                React.createElement('div', { key: idx, className: 'price-item' },
                    React.createElement('div', { className: 'price-info' },
                        React.createElement('p', { className: 'airline' }, '✈️ ' + price.airline),
                        React.createElement('p', { className: 'cabin' }, price.cabin)
                    ),
                    React.createElement('p', { className: 'price' }, price.price + ' ' + price.currency)
                )
            );

            const routeCards = Object.entries(groupedPrices).map(([route, routePrices]) =>
                React.createElement('div', { key: route, className: 'card', style: { marginBottom: '20px' } },
                    React.createElement('h2', { className: 'card-title' }, '📍 ' + route),
                    routePrices.map((price, idx) =>
                        React.createElement('div', { key: idx, className: 'price-item' },
                            React.createElement('div', { className: 'price-info' },
                                React.createElement('p', { className: 'airline' }, '✈️ ' + price.airline),
                                React.createElement('p', { className: 'cabin' }, price.cabin)
                            ),
                            React.createElement('p', { className: 'price' }, price.price + ' ' + price.currency)
                        )
                    )
                )
            );

            return React.createElement('div', { className: 'container' },
                React.createElement('div', { className: 'header' },
                    React.createElement('h1', { className: 'title' }, '✈️ Flight Price Monitor'),
                    React.createElement('p', { className: 'subtitle' }, 'Angel Tour Multi Service+ - Real-time flight price tracking'),
                    React.createElement('div', { className: 'status-badge' }, '🟢 System Active - 26 Airlines')
                ),
                React.createElement('div', { className: 'grid' },
                    React.createElement('div', { className: 'card' },
                        React.createElement('h2', { className: 'card-title' }, '📊 Price Statistics'),
                        React.createElement('div', { className: 'stats' },
                            React.createElement('div', { className: 'stat' },
                                React.createElement('p', { className: 'stat-value' }, minPrice),
                                React.createElement('p', { className: 'stat-label' }, 'Lowest Price')
                            ),
                            React.createElement('div', { className: 'stat' },
                                React.createElement('p', { className: 'stat-value' }, avgPrice),
                                React.createElement('p', { className: 'stat-label' }, 'Average Price')
                            ),
                            React.createElement('div', { className: 'stat' },
                                React.createElement('p', { className: 'stat-value' }, maxPrice),
                                React.createElement('p', { className: 'stat-label' }, 'Highest Price')
                            ),
                            React.createElement('div', { className: 'stat' },
                                React.createElement('p', { className: 'stat-value' }, prices.length),
                                React.createElement('p', { className: 'stat-label' }, 'Total Options')
                            )
                        )
                    )
                ),
                ...routeCards
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FlightDashboard));
    </script>
</body>
</html>
