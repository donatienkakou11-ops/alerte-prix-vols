<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flight Price Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #f9fafb;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f172a;
                --fg: #f1f5f9;
                --muted: #94a3b8;
                --border: #334155;
                --accent: #3b82f6;
                --success: #34d399;
                --warning: #fbbf24;
                --danger: #f87171;
                --card-bg: #1e293b;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #0f172a;
            --fg: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --card-bg: #1e293b;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px) 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-block: 24px;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--fg);
        }

        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--fg);
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }

        .price-info {
            flex: 1;
            min-width: 0;
        }

        .airline {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
            margin: 0 0 4px 0;
        }

        .cabin {
            font-size: 12px;
            color: var(--muted);
            margin: 0;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            text-align: right;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .stat {
            background: var(--bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin: 4px 0 0 0;
        }

        .empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        function FlightDashboard() {
            const [routes, setRoutes] = useState([]);
            const [prices, setPrices] = useState([
                { route: 'Abidjan → Paris', airline: 'Air France', cabin: 'ECONOMY', price: 511, currency: 'XOF' },
                { route: 'Abidjan → Paris', airline: 'Emirates', cabin: 'PREMIUM_ECONOMY', price: 1042, currency: 'XOF' },
                { route: 'Abidjan → Paris', airline: 'Emirates', cabin: 'BUSINESS', price: 2712, currency: 'XOF' },
                { route: 'Abidjan → Brussels', airline: 'Ethiopian Airlines', cabin: 'ECONOMY', price: 516, currency: 'XOF' },
                { route: 'Abidjan → Brussels', airline: 'Ethiopian Airlines', cabin: 'PREMIUM_ECONOMY', price: 1204, currency: 'XOF' },
                { route: 'Abidjan → Brussels', airline: 'Ethiopian Airlines', cabin: 'BUSINESS', price: 1827, currency: 'XOF' },
                { route: 'Abidjan → Casablanca', airline: 'Air France', cabin: 'ECONOMY', price: 450, currency: 'XOF' },
                { route: 'Abidjan → Casablanca', airline: 'Lufthansa', cabin: 'PREMIUM_ECONOMY', price: 900, currency: 'XOF' },
            ]);

            const groupedPrices = prices.reduce((acc, price) => {
                if (!acc[price.route]) acc[price.route] = [];
                acc[price.route].push(price);
                return acc;
            }, {});

            const minPrice = prices.length > 0 ? Math.min(...prices.map(p => p.price)) : 0;
            const maxPrice = prices.length > 0 ? Math.max(...prices.map(p => p.price)) : 0;
            const avgPrice = prices.length > 0 ? Math.round(prices.reduce((sum, p) => sum + p.price, 0) / prices.length) : 0;

            return (
                <div className="container">
                    <div className="header">
                        <h1 className="title">✈️ Flight Price Monitor</h1>
                        <p className="subtitle">Angel Tour Multi Service+ - Real-time flight price tracking</p>
                        <div className="status-badge">🟢 System Active - 26 Airlines</div>
                    </div>

                    <div className="grid">
                        <div className="card">
                            <h2 className="card-title">📊 Price Statistics</h2>
                            <div className="stats">
                                <div className="stat">
                                    <p className="stat-value">{minPrice}</p>
                                    <p className="stat-label">Lowest Price</p>
                                </div>
                                <div className="stat">
                                    <p className="stat-value">{avgPrice}</p>
                                    <p className="stat-label">Average Price</p>
                                </div>
                                <div className="stat">
                                    <p className="stat-value">{maxPrice}</p>
                                    <p className="stat-label">Highest Price</p>
                                </div>
                                <div className="stat">
                                    <p className="stat-value">{prices.length}</p>
                                    <p className="stat-label">Total Options</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {Object.entries(groupedPrices).map(([route, routePrices]) => (
                        <div key={route} className="card" style={{ marginBottom: '20px' }}>
                            <h2 className="card-title">
                                📍 {route}
                            </h2>
                            {routePrices.map((price, idx) => (
                                <div key={idx} className="price-item">
                                    <div className="price-info">
                                        <p className="airline">✈️ {price.airline}</p>
                                        <p className="cabin">{price.cabin}</p>
                                    </div>
                                    <p className="price">{price.price} {price.currency}</p>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<FlightDashboard />);
    </script>
</body>
</html>
